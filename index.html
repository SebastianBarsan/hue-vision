<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mosaic Colour Test</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app">
      <h1>Mosaic Colour Test</h1>
      <nav id="tabs" class="tabs" role="tablist" aria-label="Tests"></nav>
      <p id="scores" class="scores"></p>
      <p id="stage" class="stage"></p>
      <p id="message" class="message" aria-live="polite"></p>
      <div class="board">
        <canvas id="mosaic" aria-label="Mosaic of coloured squares"></canvas>
        <div id="pause" class="pause" hidden>
          <p id="pause-text"></p>
          <button id="next" type="button" class="primary">Next test</button>
        </div>
      </div>
      <div id="controls" class="buttons">
        <button id="idontsee" type="button">I don't see</button>
        <button id="restart" type="button">Restart</button>
      </div>
      <section id="results" class="results" aria-labelledby="results-title" hidden>
        <h2 id="results-title">Your results</h2>
        <p id="diagnosis" class="diagnosis"></p>
        <ul id="result-scores" class="result-scores"></ul>
        <p id="skipped-note" class="note" hidden></p>
        <p class="note">
          This is a screening tool, not a medical diagnosis. Results depend on your
          screen's colour calibration and brightness. If you have concerns about your
          colour vision, see an optometrist.
        </p>
        <button id="again" type="button" class="primary">Take the test again</button>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
